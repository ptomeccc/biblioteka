{% extends 'ksiazki/base.html' %} {% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-danger shadow-sm">
      <div class="card-body">
        <h1 class="h5">Usunąć?</h1>
        <p>
          Czy na pewno chcesz usunąć <strong>{{ obiekt }}</strong>?
        </p>
        <form method="post">
          {% csrf_token %}
          <button class="btn btn-danger">
            <i class="bi bi-trash"></i> Tak, usuń
          </button>
          <a href="{% url powrot %}" class="btn btn-secondary">Anuluj</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

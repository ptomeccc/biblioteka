{% extends 'ksiazki/base.html' %} {% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">
    Czytelnicy <span class="badge bg-secondary">{{ czytelnicy|length }}</span>
  </h1>
  <a href="{% url 'czytelnik_dodaj' %}" class="btn btn-success text-nowrap"
    ><i class="bi bi-plus-lg"></i> Dodaj</a
  >
</div>

<div class="card shadow-sm">
  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle mb-0">
      <thead class="table-dark">
        <tr>
          <th>Nazwisko</th>
          <th>Imię</th>
          <th>E-mail</th>
          <th>Numer karty</th>
          <th class="text-end">Akcje</th>
        </tr>
      </thead>
      <tbody>
        {% for c in czytelnicy %}
        <tr>
          <td class="fw-semibold"><a href="{% url 'czytelnik_szczegoly' c.pk %}">{{ c.nazwisko }}</a></td>
          <td>{{ c.imie }}</td>
          <td>{{ c.email }}</td>
          <td><code>{{ c.numer_karty }}</code></td>
          <td class="text-end text-nowrap">
            <a
              href="{% url 'czytelnik_edytuj' c.pk %}"
              class="btn btn-sm btn-outline-primary"
              ><i class="bi bi-pencil"></i> Edytuj</a
            >
            <a
              href="{% url 'czytelnik_usun' c.pk %}"
              class="btn btn-sm btn-outline-danger"
              ><i class="bi bi-trash"></i> Usuń</a
            >
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="5" class="text-center text-muted py-4">Brak czytelników.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
